<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b1a">
<title>RETRO ARCADE 359</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 14px;background:#090b1a;color:#f5f5ff;font-family:Arial,sans-serif;text-align:center;background-image:radial-gradient(#252a52 1px,transparent 1px);background-size:18px 18px}
h1{color:#39f5d0;text-shadow:0 0 12px #39f5d0;letter-spacing:3px;font-size:30px;margin:18px 0 6px}.sub{color:#aab0d5;margin-bottom:24px}.panel{max-width:480px;margin:auto;background:#12162b;border:1px solid #39416d;border-radius:18px;padding:18px;box-shadow:0 0 24px #141c44}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}.game{background:#1c2342;border:1px solid #59618f;border-radius:12px;color:white;padding:18px 8px;font-size:16px;font-weight:bold;min-height:84px}.game span{display:block;font-size:27px;margin-bottom:8px}
button{border:0;border-radius:12px;background:#39f5d0;color:#08121a;font-weight:900;padding:14px 18px;font-size:17px;margin:6px;box-shadow:0 4px 0 #159d8a;touch-action: manipulation}button:active{transform:translateY(3px);box-shadow:0 1px 0 #159d8a}#gameArea,#tankArea,#spaceArea{display:none}canvas{background:#050812;border:2px solid #39f5d0;border-radius:8px;width:min(100%,420px);height:auto;touch-action:none;display:block;margin:0 auto}#tankBoard{width:100%;max-width:520px;border:3px solid #39f5d0;box-shadow:0 0 20px #173e50;image-rendering:pixelated}#score{color:#39f5d0;font-weight:bold;margin:12px}#controls{display:grid;grid-template-columns:repeat(3,minmax(76px,96px));justify-content:center;gap:10px;margin:20px auto;max-width:320px;touch-action:none}#controls button{margin:0;padding:10px;min-height:76px;font-size:32px;border-radius:20px;touch-action:none;user-select:none;-webkit-user-select:none}.small{color:#aab0d5;font-size:12px;margin-top:18px}.tankControls{display:grid;grid-template-columns:repeat(3,minmax(76px,96px));justify-content:center;gap:10px;margin:20px auto;max-width:320px;touch-action:none}.tankControls button{margin:0;min-height:76px;font-size:29px;border-radius:20px;padding:10px 5px;touch-action:none;user-select:none;-webkit-user-select:none}.tankActions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.tankActions button{min-width:140px;min-height:64px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}.fireButton{background:#ffb347;box-shadow:0 4px 0 #bd6b19}.hint{font-size:13px;color:#aab0d5;margin:12px}.spaceControls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px auto}.spaceControls button{min-width:88px;min-height:70px;font-size:25px;touch-action:none;user-select:none;-webkit-user-select:none}#spaceBoard{width:100%;max-width:420px;border:2px solid #39f5d0;box-shadow:0 0 18px #173e50}
</style>
</head>
<body>
<h1>RETRO ARCADE 359</h1><div class="sub">DEINE MINI-SPIELE-SAMMLUNG</div>
<div class="panel" id="menu"><div class="games">
<button class="game" onclick="startSnake()"><span>🐍</span>SNAKE</button>
<button class="game" onclick="startTank()"><span>🛡️</span>TANK BATTLE</button>
<button class="game" onclick="startSpace()"><span>🚀</span>SPACE SHOOTER</button>
<button class="game" onclick="soon('BRICK BREAKER')"><span>🧱</span>BRICK BREAKER</button>
<button class="game" onclick="soon('PONG')"><span>🏓</span>PONG</button>
<button class="game" onclick="soon('RETRO JUMP')"><span>🕹️</span>RETRO JUMP</button>
</div><div class="small">RETRO-ARCADE • VERSION 1.1</div></div>
<div class="panel" id="gameArea"><h2>SNAKE</h2><div id="score">Punkte: 0</div><canvas id="board" width="320" height="320"></canvas>
<div id="controls"><span></span><button class="snakeMoveBtn" data-dx="0" data-dy="-1">▲</button><span></span><button class="snakeMoveBtn" data-dx="-1" data-dy="0">◀</button><button class="snakeMoveBtn" data-dx="0" data-dy="1">▼</button><button class="snakeMoveBtn" data-dx="1" data-dy="0">▶</button></div>
<button onclick="restart()">NEU STARTEN</button><button onclick="back()">MENÜ</button></div>
<div class="panel" id="tankArea"><h2>🛡️ TANK BATTLE</h2><div id="tankScore">Punkte: 0 · Leben: 3 · Welle: 1</div><canvas id="tankBoard" width="320" height="320"></canvas>
<div class="tankControls"><span></span><button class="moveBtn" data-dx="0" data-dy="-1">▲</button><span></span><button class="moveBtn" data-dx="-1" data-dy="0">◀</button><button class="moveBtn" data-dx="0" data-dy="1">▼</button><button class="moveBtn" data-dx="1" data-dy="0">▶</button></div>
<div class="tankActions"><button class="fireButton" id="fireHold">💥 FEUER</button><button onclick="restartTank()">↻ NEU STARTEN</button><button onclick="back()">MENÜ</button></div><div class="hint">Pfeil gedrückt halten zum Fahren · FEUER gedrückt halten zum Schießen</div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
function soon(name){alert(name+' kommt bald!')}
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');let snake,food,dir,next,score,timer,alive;
function startSnake(){document.getElementById('menu').style.display='none';document.getElementById('tankArea').style.display='none';document.getElementById('gameArea').style.display='block';restart()}
function back(){clearInterval(timer);stopSnakeMove();stopTank();document.getElementById('gameArea').style.display='none';document.getElementById('tankArea').style.display='none';document.getElementById('menu').style.display='block'}
function restart(){clearInterval(timer);snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};next={x:1,y:0};score=0;alive=true;placeFood();draw();timer=setInterval(tick,140)}
function placeFood(){food={x:Math.floor(Math.random()*16),y:Math.floor(Math.random()*16)}}
function turn(x,y){if(alive && !(x===-dir.x&&y===-dir.y))next={x,y}}
let snakeMoveHold=null;
function stopSnakeMove(){clearInterval(snakeMoveHold);snakeMoveHold=null}
document.querySelectorAll(".snakeMoveBtn").forEach(btn=>{
 const stop=()=>stopSnakeMove();
 const begin=e=>{
  e.preventDefault();
  if(btn.setPointerCapture&&e.pointerId!==undefined)btn.setPointerCapture(e.pointerId);
  const dx=Number(btn.dataset.dx),dy=Number(btn.dataset.dy);
  turn(dx,dy);
  stopSnakeMove();
  snakeMoveHold=setInterval(()=>turn(dx,dy),140);
 };
 btn.addEventListener("pointerdown",begin);
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>btn.addEventListener(ev,stop));
});
function tick(){if(!alive)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=16||h.y>=16||snake.some(p=>p.x===h.x&&p.y===h.y)){alive=false;clearInterval(timer);draw();setTimeout(()=>alert('Game Over! Punkte: '+score),50);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;placeFood()}else snake.pop();draw()}
function draw(){ctx.fillStyle='#050812';ctx.fillRect(0,0,320,320);ctx.fillStyle='#ff4d8d';ctx.fillRect(food.x*20+3,food.y*20+3,14,14);snake.forEach((p,i)=>{ctx.fillStyle=i?'#22b99c':'#39f5d0';ctx.fillRect(p.x*20+2,p.y*20+2,16,16)});document.getElementById('score').textContent='Punkte: '+score}
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')turn(0,-1);if(e.key==='ArrowDown')turn(0,1);if(e.key==='ArrowLeft')turn(-1,0);if(e.key==='ArrowRight')turn(1,0);if(e.key===' '&&document.getElementById('tankArea').style.display==='block')fireTank()});
// TANK BATTLE
const tc=document.getElementById('tankBoard'),tctx=tc.getContext('2d');let player,enemies,bullets,blocks,tankPoints,lives,tankTimer,enemyTimer,tankAlive,playerDir,moveHold=null,fireHoldTimer=null,explosions=[],wave=1,hitUntil=0,lastShot=0,bestTank=0;
function startTank(){document.getElementById('menu').style.display='none';document.getElementById('gameArea').style.display='none';document.getElementById('tankArea').style.display='block';restartTank()}
function restartTank(){stopTank();player={x:7,y:13};playerDir={x:0,y:-1};enemies=[];bullets=[];explosions=[];blocks=[{x:4,y:5},{x:5,y:5},{x:10,y:8},{x:11,y:8},{x:7,y:9},{x:2,y:10},{x:13,y:4}];tankPoints=0;lives=3;wave=1;hitUntil=0;lastShot=0;tankAlive=true;spawnEnemy();spawnEnemy();drawTank();tankTimer=setInterval(tankTick,90);enemyTimer=setInterval(enemyMove,620)}
function stopTank(){clearInterval(tankTimer);clearInterval(enemyTimer);clearInterval(moveHold);clearInterval(fireHoldTimer);moveHold=null;fireHoldTimer=null}
function spawnEnemy(){if(enemies.length<Math.min(3+wave,6)){let x=Math.floor(Math.random()*14)+1;for(let tries=0;tries<20&&(blocks.some(b=>b.x===x&&b.y===0)||enemies.some(e=>e.x===x&&e.y===0));tries++)x=Math.floor(Math.random()*14)+1;enemies.push({x,y:0,dir:1,hp:1})}}
function moveTank(dx,dy){if(!tankAlive)return;playerDir={x:dx,y:dy};let x=player.x+dx,y=player.y+dy;if(x<0||x>15||y<0||y>15||blocks.some(b=>b.x===x&&b.y===y)||enemies.some(e=>e.x===x&&e.y===y))return;player.x=x;player.y=y;drawTank()}
function fireTank(){if(!tankAlive||Date.now()-lastShot<190)return;lastShot=Date.now();bullets.push({x:player.x,y:player.y,dx:playerDir.x,dy:playerDir.y,owner:'player'});drawTank()}
function enemyMove(){if(!tankAlive)return;if(enemies.length===0){wave++;for(let n=0;n<Math.min(1+Math.floor(wave/2),3);n++)spawnEnemy()}enemies.forEach(e=>{let d=Math.floor(Math.random()*4),dirs=[[0,1],[1,0],[0,-1],[-1,0]],v=dirs[d],x=e.x+v[0],y=e.y+v[1];if(x>=0&&x<16&&y>=0&&y<16&&!blocks.some(b=>b.x===x&&b.y===y)&&!(x===player.x&&y===player.y)&&!enemies.some(o=>o!==e&&o.x===x&&o.y===y)){e.x=x;e.y=y}if(Math.random()<.45){let dx=Math.sign(player.x-e.x),dy=Math.sign(player.y-e.y);if(Math.abs(player.x-e.x)>Math.abs(player.y-e.y))dy=0;else dx=0;bullets.push({x:e.x,y:e.y,dx,dy,owner:'enemy'})}});spawnEnemy();drawTank()}
function tankTick(){if(!tankAlive)return;for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.dx;b.y+=b.dy;if(b.x<0||b.x>15||b.y<0||b.y>15||blocks.some(o=>o.x===b.x&&o.y===b.y)){bullets.splice(i,1);continue}if(b.owner==='player'){let hit=enemies.findIndex(e=>e.x===b.x&&e.y===b.y);if(hit>=0){let dead=enemies[hit];explosions.push({x:dead.x,y:dead.y,life:8});enemies.splice(hit,1);bullets.splice(i,1);tankPoints+=100;continue}}else if(b.x===player.x&&b.y===player.y&&Date.now()>hitUntil){bullets.splice(i,1);lives--;hitUntil=Date.now()+1300;explosions.push({x:player.x,y:player.y,life:12});if(lives<=0){tankAlive=false;bestTank=Math.max(bestTank,tankPoints);try{localStorage.setItem('retroTankBest',bestTank)}catch(e){}stopTank();setTimeout(()=>alert('Game Over! Punkte: '+tankPoints+' · Rekord: '+Math.max(bestTank,Number(localStorage.getItem('retroTankBest')||0))),50)}}}drawTank()}
function drawTank(){explosions=explosions.filter(ex=>ex.life-->0);tctx.fillStyle='#050812';tctx.fillRect(0,0,320,320);tctx.strokeStyle='#18213c';for(let i=0;i<=16;i++){tctx.beginPath();tctx.moveTo(i*20,0);tctx.lineTo(i*20,320);tctx.stroke();tctx.beginPath();tctx.moveTo(0,i*20);tctx.lineTo(320,i*20);tctx.stroke()}blocks.forEach(b=>{tctx.fillStyle='#343d5d';tctx.fillRect(b.x*20+1,b.y*20+1,18,18);tctx.fillStyle='#8994b8';tctx.fillRect(b.x*20+3,b.y*20+3,14,14);tctx.fillStyle='#b8c1dc';tctx.fillRect(b.x*20+5,b.y*20+5,4,4)});enemies.forEach(e=>paintTank(e.x,e.y,'#ff4d6d',0,1));if(Date.now()>hitUntil||Math.floor(Date.now()/100)%2===0)paintTank(player.x,player.y,'#39f5d0',playerDir.x,playerDir.y);bullets.forEach(b=>{tctx.fillStyle=b.owner==='player'?'#fff27a':'#ff8c42';tctx.shadowColor=tctx.fillStyle;tctx.shadowBlur=8;tctx.fillRect(b.x*20+6,b.y*20+6,8,8);tctx.shadowBlur=0});explosions.forEach(ex=>{tctx.fillStyle=ex.life%2?'#fff27a':'#ff8c42';tctx.beginPath();tctx.arc(ex.x*20+10,ex.y*20+10,(9-ex.life)*1.5+3,0,Math.PI*2);tctx.fill()});try{bestTank=Math.max(bestTank,Number(localStorage.getItem('retroTankBest')||0))}catch(e){}document.getElementById('tankScore').textContent='Punkte: '+tankPoints+' · Leben: '+lives+' · Welle: '+wave+' · Rekord: '+bestTank}
function paintTank(x,y,color,dx,dy){let px=x*20,py=y*20;tctx.fillStyle='#090d1b';tctx.fillRect(px+1,py+3,18,14);tctx.fillStyle=color;tctx.fillRect(px+3,py+3,14,14);tctx.fillStyle='#d9fff7';tctx.fillRect(px+7,py+6,6,8);tctx.fillStyle=color;tctx.fillRect(px+8+dx*5,py+8+dy*5,4,8);tctx.fillStyle='#10172b';tctx.fillRect(px+1,py+4,3,12);tctx.fillRect(px+16,py+4,3,12);tctx.fillStyle='#a8b5ce';tctx.fillRect(px+1,py+6,2,2);tctx.fillRect(px+17,py+6,2,2)}
document.addEventListener('keydown',e=>{if(document.getElementById('tankArea').style.display!=='block')return;if(e.key==='ArrowUp')moveTank(0,-1);if(e.key==='ArrowDown')moveTank(0,1);if(e.key==='ArrowLeft')moveTank(-1,0);if(e.key==='ArrowRight')moveTank(1,0)})
document.querySelectorAll(".moveBtn").forEach(btn=>{const stop=()=>{clearInterval(moveHold);moveHold=null};const begin=e=>{e.preventDefault();if(btn.setPointerCapture&&e.pointerId!==undefined)btn.setPointerCapture(e.pointerId);const dx=Number(btn.dataset.dx),dy=Number(btn.dataset.dy);moveTank(dx,dy);stop();moveHold=setInterval(()=>moveTank(dx,dy),115)};btn.addEventListener("pointerdown",begin);["pointerup","pointercancel","lostpointercapture"].forEach(ev=>btn.addEventListener(ev,stop))});const fireButton=document.getElementById("fireHold");const stopFire=()=>{clearInterval(fireHoldTimer);fireHoldTimer=null};fireButton.addEventListener("pointerdown",e=>{e.preventDefault();if(fireButton.setPointerCapture&&e.pointerId!==undefined)fireButton.setPointerCapture(e.pointerId);fireTank();stopFire();fireHoldTimer=setInterval(fireTank,220)});["pointerup","pointercancel","lostpointercapture"].forEach(ev=>fireButton.addEventListener(ev,stopFire));document.addEventListener("contextmenu",e=>{if(e.target.closest("#controls,.tankControls,.tankActions"))e.preventDefault()});

// SPACE SHOOTER
const sc=document.getElementById('spaceBoard'),sctx=sc.getContext('2d');
let shipX=150,spaceBullets=[],spaceEnemies=[],spaceStars=[],spaceScore=0,spaceLives=3,spaceTimer=null,spaceSpawn=null,spaceAlive=false,spaceMove=0,spaceMoveTimer=null,spaceFireTimer=null,spaceLastShot=0,spaceBest=0,spaceBlink=0;
function startSpace(){document.getElementById('menu').style.display='none';document.getElementById('gameArea').style.display='none';document.getElementById('tankArea').style.display='none';document.getElementById('spaceArea').style.display='block';restartSpace()}
function restartSpace(){stopSpace();shipX=150;spaceBullets=[];spaceEnemies=[];spaceStars=Array.from({length:45},()=>({x:Math.random()*320,y:Math.random()*420,s:1+Math.random()*2}));spaceScore=0;spaceLives=3;spaceAlive=true;spaceBlink=0;try{spaceBest=Number(localStorage.getItem('retroSpaceBest')||0)}catch(e){spaceBest=0}spaceTimer=setInterval(spaceTick,35);spaceSpawn=setInterval(spawnSpaceEnemy,850);spawnSpaceEnemy();drawSpace()}
function stopSpace(){clearInterval(spaceTimer);clearInterval(spaceSpawn);clearInterval(spaceMoveTimer);clearInterval(spaceFireTimer);spaceTimer=spaceSpawn=spaceMoveTimer=spaceFireTimer=null}
function spawnSpaceEnemy(){if(!spaceAlive||spaceEnemies.length>=7)return;spaceEnemies.push({x:18+Math.random()*284,y:-24,hp:1+Math.floor(spaceScore/180),speed:1.1+Math.random()*1.2+spaceScore/500})}
function fireSpace(){if(!spaceAlive||Date.now()-spaceLastShot<210)return;spaceLastShot=Date.now();spaceBullets.push({x:shipX+16,y:354})}
function moveSpace(d){if(!spaceAlive)return;spaceMove=d;shipX=Math.max(4,Math.min(284,shipX+d*8))}
function spaceTick(){if(!spaceAlive)return;spaceStars.forEach(a=>{a.y+=a.s;if(a.y>420){a.y=0;a.x=Math.random()*320}});spaceBullets.forEach(b=>b.y-=8);spaceEnemies.forEach(e=>e.y+=e.speed);for(let i=spaceBullets.length-1;i>=0;i--){let b=spaceBullets[i],hit=spaceEnemies.findIndex(e=>Math.abs(e.x-b.x)<17&&Math.abs(e.y-b.y)<17);if(hit>=0){spaceEnemies[hit].hp--;spaceBullets.splice(i,1);if(spaceEnemies[hit].hp<=0){spaceEnemies.splice(hit,1);spaceScore+=10}}else if(b.y<0)spaceBullets.splice(i,1)}for(let i=spaceEnemies.length-1;i>=0;i--){let e=spaceEnemies[i];if(e.y>435){spaceEnemies.splice(i,1);spaceLives--}else if(e.y>340&&e.y<390&&Math.abs(e.x-(shipX+16))<22){spaceEnemies.splice(i,1);spaceLives--;spaceBlink=Date.now()+450}}if(spaceLives<=0){spaceAlive=false;stopSpace();spaceBest=Math.max(spaceBest,spaceScore);try{localStorage.setItem('retroSpaceBest',spaceBest)}catch(e){}drawSpace();setTimeout(()=>alert('Game Over! Punkte: '+spaceScore+' · Rekord: '+spaceBest),50);return}drawSpace()}
function drawSpace(){sctx.fillStyle='#030611';sctx.fillRect(0,0,320,420);spaceStars.forEach(a=>{sctx.fillStyle='#9ca9d8';sctx.fillRect(a.x,a.y,a.s,a.s)});spaceBullets.forEach(b=>{sctx.fillStyle='#fff27a';sctx.shadowColor='#fff27a';sctx.shadowBlur=9;sctx.fillRect(b.x-2,b.y,4,13);sctx.shadowBlur=0});spaceEnemies.forEach(e=>{sctx.fillStyle='#ff4d6d';sctx.fillRect(e.x-13,e.y-9,26,18);sctx.fillStyle='#ffd0d9';sctx.fillRect(e.x-8,e.y-5,5,5);sctx.fillRect(e.x+3,e.y-5,5,5);sctx.fillStyle='#a51e48';sctx.fillRect(e.x-17,e.y+7,34,4)});if(Date.now()>spaceBlink||Math.floor(Date.now()/80)%2===0){sctx.fillStyle='#39f5d0';sctx.beginPath();sctx.moveTo(shipX+16,346);sctx.lineTo(shipX,376);sctx.lineTo(shipX+32,376);sctx.closePath();sctx.fill();sctx.fillStyle='#dffff9';sctx.fillRect(shipX+13,359,6,12)}sctx.fillStyle='#39f5d0';sctx.font='bold 13px Arial';sctx.fillText('SCORE '+spaceScore,10,20);sctx.fillText('LIFE '+spaceLives,250,20);document.getElementById('spaceScore').textContent='Punkte: '+spaceScore+' · Leben: '+spaceLives+' · Rekord: '+Math.max(spaceBest,spaceScore)}
document.querySelectorAll('.spaceMove').forEach(btn=>{const stop=()=>{clearInterval(spaceMoveTimer);spaceMoveTimer=null};btn.addEventListener('pointerdown',e=>{e.preventDefault();if(btn.setPointerCapture&&e.pointerId!==undefined)btn.setPointerCapture(e.pointerId);const d=Number(btn.dataset.dir);moveSpace(d);stop();spaceMoveTimer=setInterval(()=>moveSpace(d),75)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,stop))});
const spaceFire=document.getElementById('spaceFire');const stopSpaceFire=()=>{clearInterval(spaceFireTimer);spaceFireTimer=null};spaceFire.addEventListener('pointerdown',e=>{e.preventDefault();if(spaceFire.setPointerCapture&&e.pointerId!==undefined)spaceFire.setPointerCapture(e.pointerId);fireSpace();stopSpaceFire();spaceFireTimer=setInterval(fireSpace,220)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>spaceFire.addEventListener(ev,stopSpaceFire));
document.addEventListener('keydown',e=>{if(document.getElementById('spaceArea').style.display!=='block')return;if(e.key==='ArrowLeft')moveSpace(-1);if(e.key==='ArrowRight')moveSpace(1);if(e.key===' '){e.preventDefault();fireSpace()}});
\n</script></body></html>
