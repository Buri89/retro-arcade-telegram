<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b1a">
<title>RETRO ARCADE 359</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 14px;background:#090b1a;color:#f5f5ff;font-family:Arial,sans-serif;text-align:center;background-image:radial-gradient(#252a52 1px,transparent 1px);background-size:18px 18px}
h1{color:#39f5d0;text-shadow:0 0 12px #39f5d0;letter-spacing:3px;font-size:30px;margin:18px 0 6px}.sub{color:#aab0d5;margin-bottom:24px}.panel{max-width:480px;margin:auto;background:#12162b;border:1px solid #39416d;border-radius:18px;padding:18px;box-shadow:0 0 24px #141c44}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}.game{background:#1c2342;border:1px solid #59618f;border-radius:12px;color:white;padding:18px 8px;font-size:16px;font-weight:bold;min-height:84px}.game span{display:block;font-size:27px;margin-bottom:8px}
button{border:0;border-radius:10px;background:#39f5d0;color:#08121a;font-weight:bold;padding:12px 18px;font-size:16px;margin:6px}#gameArea,#tankArea{display:none}canvas{background:#050812;border:2px solid #39f5d0;border-radius:8px;width:min(100%,320px);height:auto;touch-action:none}#score{color:#39f5d0;font-weight:bold;margin:12px}#controls{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:6px;margin:12px}#controls button{margin:0;padding:12px}.small{color:#aab0d5;font-size:12px;margin-top:18px}.tankControls{display:grid;grid-template-columns:repeat(3,62px);justify-content:center;gap:6px;margin:12px}.tankControls button{margin:0;padding:13px 5px}.hint{font-size:12px;color:#aab0d5;margin:8px}
</style>
</head>
<body>
<h1>RETRO ARCADE 359</h1><div class="sub">DEINE MINI-SPIELE-SAMMLUNG</div>
<div class="panel" id="menu"><div class="games">
<button class="game" onclick="startSnake()"><span>🐍</span>SNAKE</button>
<button class="game" onclick="startTank()"><span>🛡️</span>TANK BATTLE</button>
<button class="game" onclick="soon('SPACE SHOOTER')"><span>🚀</span>SPACE SHOOTER</button>
<button class="game" onclick="soon('BRICK BREAKER')"><span>🧱</span>BRICK BREAKER</button>
<button class="game" onclick="soon('PONG')"><span>🏓</span>PONG</button>
<button class="game" onclick="soon('RETRO JUMP')"><span>🕹️</span>RETRO JUMP</button>
</div><div class="small">RETRO-ARCADE • VERSION 1.1</div></div>
<div class="panel" id="gameArea"><h2>SNAKE</h2><div id="score">Punkte: 0</div><canvas id="board" width="320" height="320"></canvas>
<div id="controls"><span></span><button onclick="turn(0,-1)">▲</button><span></span><button onclick="turn(-1,0)">◀</button><button onclick="turn(0,1)">▼</button><button onclick="turn(1,0)">▶</button></div>
<button onclick="restart()">NEU STARTEN</button><button onclick="back()">MENÜ</button></div>
<div class="panel" id="tankArea"><h2>🛡️ TANK BATTLE</h2><div id="tankScore">Punkte: 0 · Leben: 3</div><canvas id="tankBoard" width="320" height="320"></canvas>
<div class="tankControls"><span></span><button onclick="moveTank(0,-1)">▲</button><span></span><button onclick="moveTank(-1,0)">◀</button><button onclick="moveTank(0,1)">▼</button><button onclick="moveTank(1,0)">▶</button></div>
<button onclick="fireTank()">💥 FEUER</button><button onclick="restartTank()">NEU STARTEN</button><button onclick="back()">MENÜ</button><div class="hint">Steuern mit Pfeilen · Schießen mit FEUER oder Leertaste</div></div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand()}
function soon(name){alert(name+' kommt bald!')}
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');let snake,food,dir,next,score,timer,alive;
function startSnake(){document.getElementById('menu').style.display='none';document.getElementById('tankArea').style.display='none';document.getElementById('gameArea').style.display='block';restart()}
function back(){clearInterval(timer);stopTank();document.getElementById('gameArea').style.display='none';document.getElementById('tankArea').style.display='none';document.getElementById('menu').style.display='block'}
function restart(){clearInterval(timer);snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};next={x:1,y:0};score=0;alive=true;placeFood();draw();timer=setInterval(tick,140)}
function placeFood(){food={x:Math.floor(Math.random()*16),y:Math.floor(Math.random()*16)}}
function turn(x,y){if(x!==-dir.x||y!==-dir.y)next={x,y}}
function tick(){if(!alive)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=16||h.y>=16||snake.some(p=>p.x===h.x&&p.y===h.y)){alive=false;clearInterval(timer);draw();setTimeout(()=>alert('Game Over! Punkte: '+score),50);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;placeFood()}else snake.pop();draw()}
function draw(){ctx.fillStyle='#050812';ctx.fillRect(0,0,320,320);ctx.fillStyle='#ff4d8d';ctx.fillRect(food.x*20+3,food.y*20+3,14,14);snake.forEach((p,i)=>{ctx.fillStyle=i?'#22b99c':'#39f5d0';ctx.fillRect(p.x*20+2,p.y*20+2,16,16)});document.getElementById('score').textContent='Punkte: '+score}
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')turn(0,-1);if(e.key==='ArrowDown')turn(0,1);if(e.key==='ArrowLeft')turn(-1,0);if(e.key==='ArrowRight')turn(1,0);if(e.key===' '&&document.getElementById('tankArea').style.display==='block')fireTank()});
// TANK BATTLE
const tc=document.getElementById('tankBoard'),tctx=tc.getContext('2d');let player,enemies,bullets,blocks,tankPoints,lives,tankTimer,enemyTimer,tankAlive,playerDir;
function startTank(){document.getElementById('menu').style.display='none';document.getElementById('gameArea').style.display='none';document.getElementById('tankArea').style.display='block';restartTank()}
function restartTank(){stopTank();player={x:7,y:13};playerDir={x:0,y:-1};enemies=[];bullets=[];blocks=[{x:4,y:5},{x:5,y:5},{x:10,y:8},{x:11,y:8},{x:7,y:9},{x:2,y:10},{x:13,y:4}];tankPoints=0;lives=3;tankAlive=true;spawnEnemy();spawnEnemy();drawTank();tankTimer=setInterval(tankTick,100);enemyTimer=setInterval(enemyMove,650)}
function stopTank(){clearInterval(tankTimer);clearInterval(enemyTimer)}
function spawnEnemy(){if(enemies.length<4)enemies.push({x:Math.floor(Math.random()*14)+1,y:0,dir:1})}
function moveTank(dx,dy){if(!tankAlive)return;playerDir={x:dx,y:dy};let x=player.x+dx,y=player.y+dy;if(x<0||x>15||y<0||y>15||blocks.some(b=>b.x===x&&b.y===y)||enemies.some(e=>e.x===x&&e.y===y))return;player.x=x;player.y=y;drawTank()}
function fireTank(){if(!tankAlive)return;bullets.push({x:player.x,y:player.y,dx:playerDir.x,dy:playerDir.y,owner:'player'});drawTank()}
function enemyMove(){if(!tankAlive)return;enemies.forEach(e=>{let d=Math.floor(Math.random()*4),dirs=[[0,1],[1,0],[0,-1],[-1,0]],v=dirs[d],x=e.x+v[0],y=e.y+v[1];if(x>=0&&x<16&&y>=0&&y<16&&!blocks.some(b=>b.x===x&&b.y===y)&&!(x===player.x&&y===player.y)&&!enemies.some(o=>o!==e&&o.x===x&&o.y===y)){e.x=x;e.y=y}if(Math.random()<.45){let dx=Math.sign(player.x-e.x),dy=Math.sign(player.y-e.y);if(Math.abs(player.x-e.x)>Math.abs(player.y-e.y))dy=0;else dx=0;bullets.push({x:e.x,y:e.y,dx,dy,owner:'enemy'})}});spawnEnemy();drawTank()}
function tankTick(){if(!tankAlive)return;for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.dx;b.y+=b.dy;if(b.x<0||b.x>15||b.y<0||b.y>15||blocks.some(o=>o.x===b.x&&o.y===b.y)){bullets.splice(i,1);continue}if(b.owner==='player'){let hit=enemies.findIndex(e=>e.x===b.x&&e.y===b.y);if(hit>=0){enemies.splice(hit,1);bullets.splice(i,1);tankPoints+=100;continue}}else if(b.x===player.x&&b.y===player.y){bullets.splice(i,1);lives--;if(lives<=0){tankAlive=false;stopTank();setTimeout(()=>alert('Game Over! Punkte: '+tankPoints),50)}}}drawTank()}
function drawTank(){tctx.fillStyle='#050812';tctx.fillRect(0,0,320,320);tctx.strokeStyle='#18213c';for(let i=0;i<=16;i++){tctx.beginPath();tctx.moveTo(i*20,0);tctx.lineTo(i*20,320);tctx.stroke();tctx.beginPath();tctx.moveTo(0,i*20);tctx.lineTo(320,i*20);tctx.stroke()}blocks.forEach(b=>{tctx.fillStyle='#777f9c';tctx.fillRect(b.x*20+2,b.y*20+2,16,16)});enemies.forEach(e=>paintTank(e.x,e.y,'#ff4d6d',0,1));paintTank(player.x,player.y,'#39f5d0',playerDir.x,playerDir.y);bullets.forEach(b=>{tctx.fillStyle=b.owner==='player'?'#ffe66d':'#ff8c42';tctx.fillRect(b.x*20+7,b.y*20+7,6,6)});document.getElementById('tankScore').textContent='Punkte: '+tankPoints+' · Leben: '+lives}
function paintTank(x,y,color,dx,dy){tctx.fillStyle=color;tctx.fillRect(x*20+3,y*20+3,14,14);tctx.fillRect(x*20+8+dx*5,y*20+8+dy*5,4,8);tctx.fillRect(x*20+1,y*20+4,3,12);tctx.fillRect(x*20+16,y*20+4,3,12)}
document.addEventListener('keydown',e=>{if(document.getElementById('tankArea').style.display!=='block')return;if(e.key==='ArrowUp')moveTank(0,-1);if(e.key==='ArrowDown')moveTank(0,1);if(e.key==='ArrowLeft')moveTank(-1,0);if(e.key==='ArrowRight')moveTank(1,0)})
</script></body></html>
